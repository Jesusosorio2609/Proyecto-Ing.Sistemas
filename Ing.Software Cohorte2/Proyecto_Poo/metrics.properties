# Summary exclusions. These settings do not prevent classes from compiling.
# Separate multiple names with commas. Leave empty to analyze everything.
# A package exclusion also applies to all its subpackages.
# Example: metrics.exclude.packages=com.universidad.vista,com.universidad.dto
metrics.exclude.packages= com.universidad.vista

# Qualified names are recommended. A simple name excludes every matching type.
# Example: metrics.exclude.classes=com.universidad.App,com.universidad.modelo.Profesor
metrics.exclude.classes= com.universidad.servicio.AsignaturaServicio
